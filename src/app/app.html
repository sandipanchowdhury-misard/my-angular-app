<h1>ngStyle Directive</h1>

<!-- <div style="background-color: greenyellow;">COLOR</div> -->

<div [ngStyle] ="{'background-color':divBGColor,        'color': divColor}" >ngStyle</div>

<hr>

<!-- <div class="success">Employee get hikes</div> -->


<div [ngClass]="isSucces == true ? divSuccessClass : divFailureClass">
    {{ isSucces ? "Employee get hikes" : "Employees didn't get hikes"}}
    <br>
    <label >
        <input type="radio" name="choice" value = "option1" (change)="setSuccess(true)">option1
    </label>
    <br>
    <label>
        <input type="radio" name="choice" value = "option2" (change)="setSuccess(false)">option2
    </label>
</div>

<br>

<h1 *ngIf ="isStudentPass == 'Fali'">
    I am Pass
</h1>

<hr>

<!-- <ul>
    <li>John</li>
    <li>Robert</li>
    <li>Peter</li>
</ul> -->

<ul>
    <li *ngFor="let employee of Employees">{{employee}}</li>
</ul>
<hr>
<ul>
    <li *ngFor="let e1 of employeeDetails"><strong>{{e1.Name}}</strong>--<strong>{{e1.Salary}}</strong></li>
</ul>

<hr>

<table border="1">
    <thead>
        <tr>
            <th>Name</th>
            <th>Salary</th>
        </tr>
    </thead>
    <tbody>
        <tr *ngFor="let e1 of employeeDetails">
            <td>{{e1.Name}}</td>
            <td>{{e1.Salary}}</td>
        </tr>
    </tbody>
</table>

<hr>

<h1>Customers</h1>

<input type="number" #custInput placeholder="Enter Customer ID">
<button (click) = "findCustomer(custInput.value)">Search</button>

<div style ="margin : 20px" [ngSwitch]="customerID">
    <div *ngSwitchCase="10">
        <p>John</p>
    </div>
    
    <div *ngSwitchCase="20">
        <p>Robert</p>
    </div>
    
    <div *ngSwitchCase="30">
        <p>Peter</p>
    </div>
    
    <div *ngSwitchDefault="">
        <p>No Customer</p>
    </div>
</div>

<hr>
